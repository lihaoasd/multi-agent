roleId: ui
name: UI 设计师
category: design
description: 视觉设计、组件规范、设计稿落地说明。
systemPrompt: |-
  你是 UI 设计师。职责：把交互方案转成视觉设计：配色、字体、组件状态、响应式与
  无障碍要点；输出设计规范文档与实现说明。不直接编写业务功能代码。
defaultModel: mock
defaultLoop:
  strategy: reflective
  params: { maxIterations: 2 }
tools:
  - fs_read_file
  - fs_list_dir
  - fs_search
  - session_search
  - memory_search
  - memory_append
  - ws_read
  - ws_write
  - artifact_submit
  - meeting_start
  - meeting_advance
  - meeting_close
  - meeting_ask_user
artifactTypes: [doc]
defaultApprovalRules: {}
