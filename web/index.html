<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Haness</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header id="topbar">
      <h1 id="btn-home" title="回到项目列表">Agent Haness</h1>
      <span id="current-project" class="crumb hidden"></span>
      <div class="spacer"></div>
      <span id="attention-wrap" class="hidden" title="打开需你处理清单"
        ><button id="btn-attention" class="ghost">
          需你处理 <span id="attention-count" class="badge"></span></button
      ></span>
      <button id="btn-new-project">新建项目</button>
      <button id="btn-export" class="hidden">导出 zip</button>
    </header>

    <!-- 页 1：项目列表 -->
    <main id="projects-view" class="hidden">
      <div class="page-head">
        <h2>项目</h2>
        <p class="muted">选择已有项目进入会话工作台，或创建新项目开始协作。</p>
      </div>
      <div id="project-grid"></div>
      <div id="project-empty" class="empty hidden">
        还没有项目。点击右上角「新建项目」，选一个工作目录并勾选角色即可开始。
      </div>
    </main>

    <!-- 页 2：会话工作台 -->
    <main id="layout" class="hidden">
      <aside id="left">
        <div class="panel-head">
          <h4>团队</h4>
          <button id="btn-add-member" class="ghost" title="添加角色实例">＋添加</button>
        </div>
        <ul id="team-list"></ul>
        <h4>会话</h4>
        <ul id="session-list"></ul>
      </aside>
      <section id="center">
        <div id="session-header">
          <span id="session-title"></span><span id="typing" class="typing hidden">回复中…</span>
        </div>
        <div id="load-old-wrap" class="hidden"><button id="btn-load-old">加载更早消息</button></div>
        <div id="messages"></div>
        <form id="composer" class="hidden">
          <textarea id="msg-text" rows="2" placeholder="发消息给 Agent"></textarea>
          <button id="btn-send">发送</button>
        </form>
      </section>
      <aside id="right">
        <h4>任务</h4>
        <ul id="task-list"></ul>
        <h4>审批 <span id="approval-count" class="badge"></span></h4>
        <ul id="approval-list"></ul>
        <h4>会议</h4>
        <div id="meeting-actions"></div>
        <ul id="meeting-list"></ul>
        <h4>产出物</h4>
        <ul id="artifact-list"></ul>
        <h4>记忆/纪要</h4>
        <div id="memory-panel"></div>
      </aside>
    </main>

    <!-- 新建项目向导（弹窗） -->
    <div id="wizard" class="modal hidden">
      <div class="modal-box card">
        <h3>创建项目</h3>
        <label>项目名 <input id="w-name" placeholder="todo-app" /></label>
        <label
          >工作目录（绝对路径）
          <div class="inline-row">
            <input id="w-workdir" placeholder="D:/dev/todo-app" />
            <button type="button" id="btn-pick-dir">选择文件夹…</button>
          </div>
        </label>
        <fieldset id="w-roles"><legend>角色</legend></fieldset>
        <div class="row">
          <button id="btn-create" class="primary">创建并进入</button>
          <button id="btn-wizard-close">取消</button>
        </div>
      </div>
    </div>

    <!-- 目录选择器（经服务端 fs/browse 逐层浏览） -->
    <div id="dir-modal" class="modal hidden">
      <div class="modal-box card">
        <h3>选择工作目录</h3>
        <div class="dp-quick" id="dp-quick"></div>
        <div class="inline-row">
          <input id="dp-path" placeholder="输入或粘贴绝对路径，回车跳转" />
          <button type="button" id="dp-go">跳转</button>
          <button type="button" id="dp-up">上级</button>
        </div>
        <div id="dp-current" class="dp-crumb"></div>
        <ul id="dp-list" class="dp-list"></ul>
        <div class="row">
          <button type="button" id="dp-new">＋ 新建文件夹…</button>
          <span class="spacer"></span>
          <button id="dp-use" class="primary">选择此目录</button>
          <button id="dp-close">取消</button>
        </div>
      </div>
    </div>

    <!-- 需你处理弹窗 -->
    <div id="attention-modal" class="modal hidden">
      <div class="modal-box card">
        <h3>需你处理</h3>
        <ul id="attention-items"></ul>
        <div class="row"><button id="btn-attention-close">关闭</button></div>
      </div>
    </div>

    <!-- 添加角色实例弹窗 -->
    <div id="member-modal" class="modal hidden">
      <div class="modal-box card">
        <h3>添加角色到团队</h3>
        <ul id="member-list" class="member-list"></ul>
        <div class="row"><button id="btn-member-close">关闭</button></div>
      </div>
    </div>

    <div id="toast"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
